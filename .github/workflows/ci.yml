name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

