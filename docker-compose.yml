services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gopherqueue
      POSTGRES_USER: gopherqueue
      POSTGRES_PASSWORD: gopherqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_jobs.up.sql:/docker-entrypoint-initdb.d/001_create_jobs.sql:ro
      - ./migrations/000002_queue_outbox.up.sql:/docker-entrypoint-initdb.d/002_queue_outbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopherqueue -d gopherqueue"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args: { TARGET: api }
    environment: &app-env
      DATABASE_URL: postgres://gopherqueue:gopherqueue@postgres:5432/gopherqueue?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      REDIS_CONSUMER_GROUP: gopherqueue-workers
      HTTP_PORT: "8080"
      WORKER_COUNT: "4"
      MAX_JOB_ATTEMPTS: "3"
      JOB_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 15s
      PRIORITY_HIGH_WEIGHT: "5"
      PRIORITY_MEDIUM_WEIGHT: "3"
      PRIORITY_LOW_WEIGHT: "1"
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      args: { TARGET: worker }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

